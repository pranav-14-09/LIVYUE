      <stop offset="0%" stop-color="#1F1B17"/>
      <stop offset="100%" stop-color="#14110E"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Plate -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="102" fill="none" stroke="#38312A" stroke-width="6"/>

